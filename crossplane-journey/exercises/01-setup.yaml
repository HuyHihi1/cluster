# Bài tập 1: Cài đặt Provider Kubernetes
# Mục tiêu: Cài đặt controller giúp Crossplane có thể quản lý các tài nguyên K8s khác.

apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.13.0
---
# Bài tập 2: Cấu hình Quyền (ProviderConfig)
# Mục tiêu: Cho phép Crossplane sử dụng ServiceAccount của chính nó để thao tác với cluster.

apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: InjectedIdentity
